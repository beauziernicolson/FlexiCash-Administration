name: FlexiCash Web Audit Mirror Gate

on:
  push:
    branches:
      - main
      - audit/web-mirror-2d60e810
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify complete Web mirror
        run: npm test
