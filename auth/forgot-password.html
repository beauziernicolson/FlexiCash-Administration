<!doctype html><html lang="fr"><head>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mot de passe oublié — FlexiCash</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/reset.css"><link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/auth.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/brand-green.css">
<script src="../assets/vendor/lucide/lucide-subset.js" defer></script>
<link rel="stylesheet" href="../assets/css/ux-polish.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head><body>
<div style="min-height:100vh; display:grid; place-items:center; padding:24px;">
  <div class="card" style="width:100%; max-width:440px;">
    <h1 style="font-size:1.6rem;">Réinitialiser votre mot de passe</h1>
    <p class="muted mt-8">Entrez votre email — nous vous enverrons un lien de réinitialisation.</p>
    <form class="stack mt-24" style="--gap:14px;" id="f">
      <div class="field"><label for="forgot-email">Adresse email</label><input class="input" id="forgot-email" name="email" autocomplete="email" placeholder="vous@exemple.ht" type="email" required/></div>
      <div id="forgot-turnstile"></div>
      <button class="btn btn-primary btn-block lg">Envoyer le lien</button>
    </form>
    <div class="mt-16 center"><a href="login.html" class="btn-link"><i data-lucide="arrow-left" aria-hidden="true"></i> Retour à la connexion</a></div>
  </div>
</div>
<script type="module">
import { attachForgotForm } from "../assets/js/pages/password-recovery.js";
import { attachTurnstile } from "../assets/js/services/turnstile-service.js";
import "../assets/js/app.js";
const turnstile = await attachTurnstile("forgot-turnstile");
attachForgotForm(document.getElementById('f'), turnstile);
</script></body></html>
