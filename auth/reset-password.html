<!doctype html><html lang="fr"><head>
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nouveau mot de passe — FlexiCash</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/reset.css"><link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/components.css"><link rel="stylesheet" href="../assets/css/auth.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
<link rel="stylesheet" href="../assets/css/brand-green.css">
<script src="../assets/vendor/lucide/lucide-subset.js" defer></script>
<link rel="stylesheet" href="../assets/css/ux-polish.css">
</head><body>
<div style="min-height:100vh; display:grid; place-items:center; padding:24px;">
  <div class="card" style="width:100%; max-width:440px;">
    <h1 style="font-size:1.6rem;">Choisir un nouveau mot de passe</h1>
    <p class="muted mt-8">Ce mot de passe protégera votre compte FlexiCash.</p>
    <form class="stack mt-24" style="--gap:14px;" id="f">
      <div class="field"><label for="new-password">Nouveau mot de passe</label><input class="input" id="new-password" name="password" autocomplete="new-password" type="password" required minlength="8"/></div>
      <div class="field"><label for="confirm-password">Confirmer le mot de passe</label><input class="input" id="confirm-password" name="password_confirmation" autocomplete="new-password" type="password" required minlength="8"/></div>
      <button class="btn btn-primary btn-block lg">Enregistrer</button>
    </form>
  </div>
</div>
<script type="module">
import { attachResetForm } from "../assets/js/pages/password-recovery.js";
import "../assets/js/app.js";
attachResetForm(document.getElementById('f'));
</script></body></html>
